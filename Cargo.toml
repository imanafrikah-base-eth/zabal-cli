[package]
name = "zabal-cli"
version = "0.1.0"
edition = "2021"
description = "Generate ZABAL hackathon submission documents from your Git commit history"
repository = "https://github.com/imanafrikah-base-eth/zabal-cli"
license = "MIT"

[lib]
name = "zabal_cli"
path = "src/lib.rs"

[[bin]]
name = "zabal"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
git2 = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
